<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle dot matrix pattern -->
  <g opacity="0.12" fill="#94A3B8">
    <circle cx="80" cy="60" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/><circle cx="320" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="560" cy="60" r="1.5"/><circle cx="640" cy="60" r="1.5"/><circle cx="720" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/><circle cx="880" cy="60" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/><circle cx="160" cy="140" r="1.5"/><circle cx="240" cy="140" r="1.5"/><circle cx="320" cy="140" r="1.5"/><circle cx="400" cy="140" r="1.5"/><circle cx="480" cy="140" r="1.5"/><circle cx="560" cy="140" r="1.5"/><circle cx="640" cy="140" r="1.5"/><circle cx="720" cy="140" r="1.5"/><circle cx="800" cy="140" r="1.5"/><circle cx="880" cy="140" r="1.5"/>
    <circle cx="80" cy="460" r="1.5"/><circle cx="160" cy="460" r="1.5"/><circle cx="240" cy="460" r="1.5"/><circle cx="320" cy="460" r="1.5"/><circle cx="400" cy="460" r="1.5"/><circle cx="480" cy="460" r="1.5"/><circle cx="560" cy="460" r="1.5"/><circle cx="640" cy="460" r="1.5"/><circle cx="720" cy="460" r="1.5"/><circle cx="800" cy="460" r="1.5"/><circle cx="880" cy="460" r="1.5"/>
  </g>

  <!-- TOP LAYER: AGENT RUNTIMES -->
  <g transform="translate(60, 40)">
    <text x="420" y="0" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">AUTONOMOUS AGENTS &amp; PROTOCOL RUNTIMES</text>
    
    <!-- Node 1: Google ADK -->
    <rect x="50" y="20" width="220" height="54" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="74" cy="47" r="6" fill="#38BDF8" />
    <text x="92" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">Google ADK</text>
    <text x="92" y="60" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">Go Agent Framework</text>

    <!-- Node 2: A2A Protocol -->
    <rect x="310" y="20" width="220" height="54" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="334" cy="47" r="6" fill="#818CF8" />
    <text x="352" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">A2A Protocol</text>
    <text x="352" y="60" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">Agent-to-Agent Mesh</text>

    <!-- Node 3: Custom / Frameworks -->
    <rect x="570" y="20" width="220" height="54" rx="10" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="594" cy="47" r="6" fill="#A78BFA" />
    <text x="612" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">Custom Agents</text>
    <text x="612" y="60" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">LangGraph / CrewAI / HTTP</text>
  </g>

  <!-- Connectors Top to Core -->
  <path d="M 220 114 L 220 160 L 480 160 L 480 175" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />
  <path d="M 480 114 L 480 175" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />
  <path d="M 740 114 L 740 160 L 480 160 L 480 175" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />

  <!-- MIDDLE LAYER: AGENTMESH CONTROL & DATA PLANE -->
  <g transform="translate(100, 175)">
    <!-- Outer Core Box -->
    <rect x="0" y="0" width="760" height="175" rx="14" fill="#0F172A" stroke="url(#meshGrad)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="760" height="42" rx="14" fill="#1E293B" />
    <rect x="0" y="28" width="760" height="14" fill="#1E293B" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    <text x="380" y="26" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">AgentMesh Control Plane &amp; High-Performance Data Proxy</text>
    
    <!-- Feature Pillars -->
    <!-- Pillar 1: Identity & Isolation -->
    <rect x="20" y="55" width="132" height="100" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="86" y="80" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Identity &amp; RLS</text>
    <text x="86" y="100" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">AgentContract</text>
    <text x="86" y="116" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Multi-Tenant</text>
    <text x="86" y="132" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Agent Passport</text>

    <!-- Pillar 2: Semantic Policy -->
    <rect x="166" y="55" width="132" height="100" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="232" y="80" fill="#60A5FA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Policy Engine</text>
    <text x="232" y="100" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Deterministic Gate</text>
    <text x="232" y="116" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">HITL Token Bind</text>
    <text x="232" y="132" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Taint Check</text>

    <!-- Pillar 3: Capability Routing -->
    <rect x="314" y="55" width="132" height="100" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="380" y="80" fill="#818CF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Smart Routing</text>
    <text x="380" y="100" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">P95 SLA Scoring</text>
    <text x="380" y="116" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Cost Optimizer</text>
    <text x="380" y="132" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Fallback Chain</text>

    <!-- Pillar 4: Reliability & Budgets -->
    <rect x="462" y="55" width="132" height="100" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="528" y="80" fill="#A78BFA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Reliability</text>
    <text x="528" y="100" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Circuit Breakers</text>
    <text x="528" y="116" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Token Budgets</text>
    <text x="528" y="132" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Cycle Detection</text>

    <!-- Pillar 5: Progressive CD -->
    <rect x="608" y="55" width="132" height="100" rx="8" fill="#1E293B" stroke="#334155" />
    <text x="674" y="80" fill="#C084FC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Progressive CD</text>
    <text x="674" y="100" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Canary Splits</text>
    <text x="674" y="116" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Auto-Rollback</text>
    <text x="674" y="132" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Shadow Tests</text>
  </g>

  <!-- Connectors Core to Bottom -->
  <path d="M 480 350 L 480 395 L 220 395 L 220 415" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />
  <path d="M 480 350 L 480 415" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />
  <path d="M 480 350 L 480 395 L 740 395 L 740 415" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4,4" />

  <!-- BOTTOM LAYER: MCP TOOLS, MODELS, CLOUD -->
  <g transform="translate(60, 415)">
    <!-- Destination 1: MCP Tools -->
    <rect x="50" y="0" width="220" height="58" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="74" cy="29" r="6" fill="#38BDF8" />
    <text x="92" y="24" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">MCP Tool Servers</text>
    <text x="92" y="42" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">BigQuery • Postgres • APIs</text>

    <!-- Destination 2: Model Providers -->
    <rect x="310" y="0" width="220" height="58" rx="10" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="334" cy="29" r="6" fill="#818CF8" />
    <text x="352" y="24" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">Model Providers</text>
    <text x="352" y="42" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">Gemini • Vertex AI • Local</text>

    <!-- Destination 3: Cloud Infrastructure -->
    <rect x="570" y="0" width="220" height="58" rx="10" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="594" cy="29" r="6" fill="#A78BFA" />
    <text x="612" y="24" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">Cloud Infrastructure</text>
    <text x="612" y="42" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">GKE • Cloud Run • Telemetry</text>
  </g>
</svg>
