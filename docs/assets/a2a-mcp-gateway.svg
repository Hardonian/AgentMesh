<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <linearGradient id="protoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="760" height="300" rx="14" fill="url(#protoBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Caller Agent -->
  <g transform="translate(40, 110)">
    <rect width="160" height="70" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="24" cy="35" r="7" fill="#38BDF8" />
    <text x="42" y="32" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700">Primary Agent</text>
    <text x="42" y="50" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">e.g. Finance Agent</text>
  </g>

  <!-- Flow Line 1: A2A -->
  <path d="M 200 145 L 290 145" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="295,145 285,140 285,150" fill="#38BDF8" />
  <rect x="215" y="122" width="65" height="20" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="247" y="136" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700" text-anchor="middle">A2A Task</text>

  <!-- Middle Gate: AgentMesh Proxy -->
  <g transform="translate(300, 50)">
    <rect width="180" height="190" rx="12" fill="#0F172A" stroke="url(#proxyGrad)" stroke-width="2" />
    <rect width="180" height="32" rx="12" fill="#1E293B" />
    <rect y="20" width="180" height="12" fill="#1E293B" />
    <text x="90" y="22" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" text-anchor="middle">AgentMesh Proxy</text>

    <!-- Checklist inside Proxy -->
    <text x="18" y="58" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Cryptographic Auth</text>
    <text x="18" y="80" fill="#60A5FA" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Deterministic Policy</text>
    <text x="18" y="102" fill="#818CF8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Delegation Depth &lt; 5</text>
    <text x="18" y="124" fill="#A78BFA" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Cycle Loop Check</text>
    <text x="18" y="146" fill="#C084FC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Secret Scrubber</text>
    <text x="18" y="168" fill="#F472B6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">✓ Token/Cost Budget</text>
  </g>

  <!-- Flow Line 2: Downstream A2A -->
  <path d="M 480 110 L 550 85" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="555,83 544,82 548,91" fill="#818CF8" />
  <rect x="490" y="70" width="60" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="1" />
  <text x="520" y="83" fill="#818CF8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="700" text-anchor="middle">A2A Handshake</text>

  <!-- Downstream 1: Peer Agent -->
  <g transform="translate(560, 50)">
    <rect width="160" height="65" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="22" cy="32" r="6" fill="#818CF8" />
    <text x="38" y="28" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">Sub-Agent (A2A)</text>
    <text x="38" y="46" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">e.g. Research Agent</text>
  </g>

  <!-- Flow Line 3: Downstream MCP -->
  <path d="M 480 180 L 550 205" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="555,207 548,199 544,208" fill="#38BDF8" />
  <rect x="490" y="200" width="60" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="520" y="213" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="700" text-anchor="middle">MCP JSON-RPC</text>

  <!-- Downstream 2: MCP Tools -->
  <g transform="translate(560, 175)">
    <rect width="160" height="65" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="22" cy="32" r="6" fill="#38BDF8" />
    <text x="38" y="28" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">MCP Tool Servers</text>
    <text x="38" y="46" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">BigQuery, APIs, Databases</text>
  </g>
</svg>
