<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#scBg)" />

  <!-- Subtle mesh grid lines -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" /><line x1="250" y1="0" x2="250" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" /><line x1="550" y1="0" x2="550" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" /><line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" /><line x1="1150" y1="0" x2="1150" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" /><line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="340" x2="1200" y2="340" /><line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="0" y1="580" x2="1200" y2="580" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect width="160" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#38BDF8" />
    <text x="30" y="21" fill="#38BDF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" letter-spacing="1">OPEN CONTROL PLANE</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="56" font-weight="800" letter-spacing="-1">AgentMesh</text>
    <rect x="0" y="115" width="280" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="160" fill="#E2E8F0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="600">The open control plane for A2A and MCP agents.</text>
    
    <!-- Supporting Description -->
    <text x="0" y="200" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="400">Identity • Semantic Policy • Capability Routing</text>
    <text x="0" y="225" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="400">Reliability • Progressive Delivery • OpenTelemetry</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 275)">
      <rect width="90" height="30" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="45" y="20" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Go-Native</text>

      <rect x="102" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="159" y="20" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Google ADK</text>

      <rect x="229" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="286" y="20" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">A2A Protocol</text>

      <rect x="356" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="413" y="20" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">MCP Gateway</text>

      <rect x="483" y="0" width="115" height="30" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="540" y="20" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Apache-2.0</text>
    </g>

    <!-- Version & Certification -->
    <text x="0" y="365" fill="#10B981" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">✓ v1.0.0 Production Certified (GO)</text>
  </g>

  <!-- Right Side: Architecture Node Card -->
  <g transform="translate(720, 110)" filter="url(#cardGlow)">
    <rect width="400" height="400" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect width="400" height="40" rx="16" fill="#1E293B" />
    <rect y="25" width="400" height="15" fill="#1E293B" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="20" r="5" fill="#10B981" opacity="0.8"/>
    <text x="80" y="25" fill="#94A3B8" font-family="monospace" font-size="12">agentmesh proxy --fleet</text>

    <!-- Inside Card Visualization -->
    <g transform="translate(24, 60)">
      <!-- Step 1 -->
      <rect width="352" height="52" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
      <text x="16" y="26" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">1. AGENT IDENTITY</text>
      <text x="16" y="42" fill="#94A3B8" font-family="monospace" font-size="10">finance-agent:v18 [A2A Verified]</text>
      <text x="325" y="32" fill="#10B981" font-family="monospace" font-size="12">✓</text>

      <!-- Step 2 -->
      <rect y="64" width="352" height="52" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
      <text x="16" y="90" fill="#818CF8" font-family="monospace" font-size="11" font-weight="700">2. DETERMINISTIC POLICY</text>
      <text x="16" y="106" fill="#94A3B8" font-family="monospace" font-size="10">bigquery.read -> ALLOW [0ms eval]</text>
      <text x="325" y="96" fill="#10B981" font-family="monospace" font-size="12">✓</text>

      <!-- Step 3 -->
      <rect y="128" width="352" height="52" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="1.2" />
      <text x="16" y="154" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="700">3. CAPABILITY ROUTE</text>
      <text x="16" y="170" fill="#94A3B8" font-family="monospace" font-size="10">Selected: research-agent [99.8% SLA]</text>
      <text x="325" y="160" fill="#10B981" font-family="monospace" font-size="12">✓</text>

      <!-- Step 4 -->
      <rect y="192" width="352" height="52" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="1.2" />
      <text x="16" y="218" fill="#C084FC" font-family="monospace" font-size="11" font-weight="700">4. MCP TOOL EXECUTION</text>
      <text x="16" y="234" fill="#94A3B8" font-family="monospace" font-size="10">BigQuery JSON-RPC [Secret Scrubbed]</text>
      <text x="325" y="224" fill="#10B981" font-family="monospace" font-size="12">✓</text>

      <!-- Step 5 -->
      <rect y="256" width="352" height="52" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
      <text x="16" y="282" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">5. OPENTELEMETRY TRACE</text>
      <text x="16" y="298" fill="#94A3B8" font-family="monospace" font-size="10">Trace: 01J6X7... | Latency: 127ms</text>
      <text x="325" y="288" fill="#10B981" font-family="monospace" font-size="12">✓</text>
    </g>
  </g>
</svg>
