apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentmesh-controller
  labels:
    cloud.google.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/agentmesh-controller:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: AGENTMESH_ENV
              value: "production"
            - name: AGENTMESH_LOG_LEVEL
              value: "info"
