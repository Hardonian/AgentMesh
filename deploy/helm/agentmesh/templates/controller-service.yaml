apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    app.kubernetes.io/name: agentmesh-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.controller.service.type }}
  ports:
    - port: {{ .Values.controller.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: agentmesh-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
